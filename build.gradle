plugins {
    id 'com.android.application' version '8.5.2' apply false
}

// The hidden versionCode Android compares on every update, from awanVersion (gradle.properties):
// X.Y.Z gives X * 1000000 + Y * 1000 + Z, so 1.0.0 is 1000000 and 1.2.3 is 1002003. Each part 0 to 999.
ext.awanVersionCode = { String v ->
    def parts = v.trim().tokenize('.')
    if (parts.size() != 3 || !parts.every { it ==~ /\d{1,3}/ }) {
        throw new GradleException("awanVersion must be X.Y.Z, each part 0 to 999: " + v)
    }
    Integer.parseInt(parts[0]) * 1000000 + Integer.parseInt(parts[1]) * 1000 + Integer.parseInt(parts[2])
}
