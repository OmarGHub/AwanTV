plugins {
    id 'com.android.application'
}

android {
    namespace 'app.awanpro.tv'
    compileSdk 34

    defaultConfig {
        // Its own application id, so Awan TV installs beside Afnon.
        applicationId 'app.awanpro.tv'
        minSdk 26
        targetSdk 34
        // Both from awanVersion in gradle.properties: change the version there only.
        versionName awanVersion
        versionCode rootProject.ext.awanVersionCode.call(awanVersion)
    }

    // No encrypted dependency list in the APK: only Google Play reads it, and F-Droid and IzzyOnDroid flag it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The release file keeps one name across versions (the version is on the release page and in the app), so the
    // guide's .../releases/latest/download/AwanTV.apk link never changes. Debug builds keep their default name.
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { outputFileName = 'AwanTV.apk' }
        }
    }
}

// mp3quran.net's reciter and surah lists, carried in the app (assets/mp3quran) so a saved recitation keeps its names
// after a reinstall without internet (Library.listText). Every release build reads them again and replaces the copy
// when they changed (git then shows it); without internet, or with an odd answer, the copy stays and the build goes on.
// A debug build reads them only when there is no copy yet.
def mp3quranDir = file('src/main/assets/mp3quran')
def mp3quranLists = ['reciters-ar.json': 'reciters?language=ar', 'reciters-en.json': 'reciters?language=eng',
                     'suwar-ar.json': 'suwar?language=ar', 'suwar-en.json': 'suwar?language=eng']
def mp3quranRead = { boolean onlyMissing ->
    def api = project.findProperty('mp3quranApi') ?: 'https://mp3quran.net/api/v3/'
    def slurper = new groovy.json.JsonSlurper()
    def keys = { json -> (json.reciters ?: []).collectMany { r -> (r.moshaf ?: []).collect { m -> "r${r.id}-m${m.id}".toString() } } as Set }
    mp3quranDir.mkdirs()
    mp3quranLists.each { name, path ->
        def f = new File(mp3quranDir, name)
        if (onlyMissing && f.exists()) return
        def got, json
        try {
            def con = new URL(api + path).openConnection()
            con.connectTimeout = 15000
            con.readTimeout = 60000
            con.setRequestProperty('User-Agent', 'AwanTV-build')
            got = con.inputStream.getText('UTF-8')
            json = slurper.parseText(got)
            def items = name.startsWith('suwar') ? json.suwar : json.reciters
            if (!(items instanceof List) || items.size() < (name.startsWith('suwar') ? 114 : 50)) {
                throw new IOException('not the list expected')
            }
        } catch (Exception e) {
            logger.warn("mp3quran ${name}: not read (${e.class.simpleName}: ${e.message?.readLines()?.find { it.trim() } ?: ''}); " + (f.exists() ? 'the copy in the app stays' : 'the app has no copy'))
            return
        }
        def old = null
        if (f.exists()) {
            try { old = slurper.parseText(f.getText('UTF-8')) } catch (Exception ignored) { }
        }
        if (old == json) {
            logger.lifecycle("mp3quran ${name}: unchanged")
            return
        }
        def tmp = new File(mp3quranDir, name + '.tmp')
        tmp.write(got, 'UTF-8')
        f.delete()
        if (!tmp.renameTo(f)) throw new GradleException("Could not write ${f}")
        if (name.startsWith('suwar')) {
            logger.lifecycle("mp3quran ${name}: " + (old == null ? 'added' : 'updated'))
        } else {
            Set before = old == null ? ([] as Set) : keys(old)
            Set now = keys(json)
            logger.lifecycle("mp3quran ${name}: " + (old == null ? "added, ${now.size()} recordings"
                : "updated, ${(now - before).size()} added, ${(before - now).size()} removed, ${now.size()} recordings"))
        }
    }
}
tasks.register('readMp3quran') { doLast { mp3quranRead(false) } }
tasks.register('readMp3quranIfMissing') { doLast { mp3quranRead(true) } }
tasks.configureEach { t ->
    if (t.name == 'preReleaseBuild') t.dependsOn 'readMp3quran'
    if (t.name == 'preDebugBuild') t.dependsOn 'readMp3quranIfMissing'
}

// The screens' texts (res/values*/texts.xml, from Text.java: languages plan, phase 1) are checked before every build,
// as Android's own lint lets a release through with some of these. The build stops on:
//  - a key in one language and not in English (values/), or one in English missing from another language;
//  - a value not wholly between double quotes (Android would merge spaces and drop leading and trailing ones), or a
//    bare double quote inside one (Android drops it without a word);
//  - in a string, a percent sign but %1$s... (a part) or %% (the sign itself): Text.fill writes the parts itself, never
//    String.format, whose numbers in the resources' locale could be Eastern where d() wrote Western ones; in an
//    array (read as written), any placeholder;
//  - placeholders that differ from English's, or an array with another number of items.
// A language not yet announced (a values-xx folder listed in unannouncedTexts) is checked as a warning only.
def textsUnannounced = (project.findProperty('unannouncedTexts') ?: '').split(',').findAll { it }.collect { it.trim() }
tasks.register('checkTexts') {
    def resDir = file('src/main/res')
    inputs.files(fileTree(resDir) { include 'values*/texts.xml' })
    doLast {
        def read = { File f ->
            def raw = f.getText('UTF-8')
            def strings = [:], arrays = [:], problems = []
            (raw =~ /(?s)<string name="(\w+)"[^>]*>(.*?)<\/string>/).each { m -> strings[m[1]] = m[2] }
            (raw =~ /(?s)<string-array name="(\w+)"[^>]*>(.*?)<\/string-array>/).each { m ->
                arrays[m[1]] = (m[2] =~ /(?s)<item[^>]*>(.*?)<\/item>/).collect { it[1] }
            }
            def value = { String where, String v, boolean isArray ->
                if (!(v.length() >= 2 && v.startsWith('"') && v.endsWith('"'))) { problems << "${where}: not between double quotes"; return }
                def inner = v.substring(1, v.length() - 1)
                if (inner =~ /(?<!\\)(\\\\)*"/) problems << "${where}: a double quote without a backslash"
                if (isArray) {
                    if (inner =~ '%\\d+\\$') problems << "${where}: a placeholder in an array (arrays are read as written)"
                } else if (inner.replaceAll('%%|%\\d+\\$s', '').contains('%')) {
                    problems << "${where}: a percent sign other than %1\$s... or %% (a percent sign is written %%; no %d or %f)"
                }
            }
            strings.each { k, v -> value("string ${k}", v, false) }
            arrays.each { k, items -> items.eachWithIndex { v, i -> value("array ${k}[${i}]", v, true) } }
            [strings: strings, arrays: arrays, problems: problems]
        }
        def holes = { String v -> (v =~ '%(\\d+)\\$s').collect { it[1] }.toSet() }
        def english = read(new File(resDir, 'values/texts.xml'))
        def errors = english.problems.collect { "values/texts.xml ${it}" }
        def warnings = []
        resDir.listFiles().findAll { it.isDirectory() && it.name.startsWith('values-') && new File(it, 'texts.xml').exists() }.sort().each { dir ->
            def lang = read(new File(dir, 'texts.xml'))
            def found = lang.problems.collect { "${dir.name}/texts.xml ${it}" }
            english.strings.keySet().findAll { !lang.strings.containsKey(it) }.each { found << "${dir.name}: string ${it} missing" }
            lang.strings.keySet().findAll { !english.strings.containsKey(it) }.each { found << "${dir.name}: string ${it} not in English" }
            english.arrays.keySet().findAll { !lang.arrays.containsKey(it) }.each { found << "${dir.name}: array ${it} missing" }
            lang.arrays.keySet().findAll { !english.arrays.containsKey(it) }.each { found << "${dir.name}: array ${it} not in English" }
            english.strings.each { k, v -> if (lang.strings[k] != null && holes(v) != holes(lang.strings[k])) found << "${dir.name}: string ${k} has other placeholders" }
            english.arrays.each { k, v -> if (lang.arrays[k] != null && v.size() != lang.arrays[k].size()) found << "${dir.name}: array ${k} has ${lang.arrays[k].size()} items, English ${v.size()}" }
            if (textsUnannounced.contains(dir.name)) warnings.addAll(found) else errors.addAll(found)
        }
        warnings.each { logger.warn("texts (not announced): ${it}") }
        if (errors) throw new GradleException("The screens' texts have ${errors.size()} problem(s):\n  " + errors.join('\n  '))
        logger.lifecycle("texts: ${english.strings.size()} strings and ${english.arrays.size()} arrays checked")
    }
}
tasks.named('preBuild') { dependsOn 'checkTexts' }

// The fonts have every letter a language's texts use (languages plan, phase 4): each character of a values-xx/texts.xml
// that the Arabic and English texts do not already use (those show today) must be in every font of res/font
// (Alexandria for the words, Amiri for the titles and numbers), or Android draws it in another font or as a box.
// Spaces and Unicode's format marks (direction marks, joiners) are left out. A language not yet announced
// (unannouncedTexts) is checked as a warning only.
tasks.register('checkFonts') {
    def resDir = file('src/main/res')
    inputs.files(fileTree(resDir) { include 'values*/texts.xml'; include 'font/*.ttf' })
    doLast {
        def chars = { File f ->
            def raw = f.getText('UTF-8')
            def out = new TreeSet<Integer>()
            (raw =~ /(?s)<(?:string|item)\b[^>]*>(.*?)<\/(?:string|item)>/).each { m ->
                def v = m[1].replace('&lt;', '<').replace('&gt;', '>').replace('&quot;', '"').replace('&apos;', "'").replace('&amp;', '&')
                v = v.replaceAll(/\\u([0-9a-fA-F]{4})/) { all, hex -> new String(Character.toChars(Integer.parseInt(hex, 16))) }
                v = v.replaceAll(/\\[nt]/, ' ').replaceAll(/\\(.)/, '$1')
                if (v.length() >= 2 && v.startsWith('"') && v.endsWith('"')) v = v.substring(1, v.length() - 1)
                v.codePoints().each { int cp ->
                    if (!Character.isWhitespace(cp) && Character.getType(cp) != Character.FORMAT && !Character.isISOControl(cp)) out << cp
                }
            }
            out
        }
        def shown = chars(new File(resDir, 'values/texts.xml')) + chars(new File(resDir, 'values-ar/texts.xml'))
        def fonts = new File(resDir, 'font').listFiles().findAll { it.name.endsWith('.ttf') }.sort().collect { f ->
            [name: f.name, font: java.awt.Font.createFont(java.awt.Font.TRUETYPE_FONT, f)]
        }
        def errors = [], warnings = []
        resDir.listFiles().findAll { it.isDirectory() && it.name.startsWith('values-') && it.name != 'values-ar' && new File(it, 'texts.xml').exists() }.sort().each { dir ->
            def found = []
            (chars(new File(dir, 'texts.xml')) - shown).each { int cp ->
                def missing = fonts.findAll { !it.font.canDisplay(cp) }.collect { it.name }
                if (missing) found << String.format('%s: U+%04X %s not in %s', dir.name, cp, new String(Character.toChars(cp)), missing.join(', '))
            }
            if (textsUnannounced.contains(dir.name)) warnings.addAll(found) else errors.addAll(found)
        }
        warnings.each { logger.warn("fonts (not announced): ${it}") }
        if (errors) throw new GradleException("The fonts lack ${errors.size()} character(s):\n  " + errors.join('\n  '))
        logger.lifecycle("fonts: ${fonts.size()} fonts checked")
    }
}
tasks.named('preBuild') { dependsOn 'checkFonts' }

dependencies {
    // Offline prayer-time calculation (no network, no transitive dependencies).
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
}
