org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Awan TV's version (X.Y.Z): the one number shown anywhere, taken by both the app and the installer. Android's hidden
# versionCode is worked out from it in build.gradle, so a higher version always installs over a lower one.
# Test builds toward X.Y.Z add a letter, a new one with every build sent (1.1.0a, 1.1.0b, ...), so the screen tells
# them apart; the release drops it (AwanTV-release refuses a lettered version).
awanVersion=1.4.0
